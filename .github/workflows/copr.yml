name: Publish to Fedora COPR

on:
  release:
    types: [published]
  push:
    branches:
      - 'copr/v[0-9]+.[0-9]+.[0-9]+-[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Package-RPM release tag
        required: true
        default: v0.1.4-1

permissions:
  contents: read

concurrency:
  group: copr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build maher-xs/uqda
    runs-on: ubuntu-latest
    container: fedora:44
    env:
      COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Install publishing tools
        run: dnf -y install copr-cli gh
      - name: Configure COPR credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${COPR_CONFIG}" || {
            echo "COPR_CONFIG repository secret is not configured" >&2
            exit 1
          }
          install -d -m 0700 "${HOME}/.config"
          printf '%s\n' "${COPR_CONFIG}" > "${HOME}/.config/copr"
          chmod 0600 "${HOME}/.config/copr"
      - name: Resolve and verify the release tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG:-}"
          if [ -z "${TAG}" ]; then
            TAG="${GITHUB_REF_NAME#copr/}"
          fi
          case "${TAG}" in
            v[0-9]*.[0-9]*.[0-9]*-[0-9]*) ;;
            *) echo "invalid Package-RPM release tag: ${TAG}" >&2; exit 1 ;;
          esac
          gh release view "${TAG}" --repo Uqda/Package-RPM >/dev/null
          echo "RELEASE_TAG=${TAG}" >> "${GITHUB_ENV}"
      - name: Download the released source RPM
        shell: bash
        run: |
          set -euo pipefail
          mkdir source-rpm
          gh release download "${RELEASE_TAG}" \
            --repo Uqda/Package-RPM \
            --pattern '*.src.rpm' \
            --dir source-rpm
          test "$(find source-rpm -maxdepth 1 -name '*.src.rpm' | wc -l)" -eq 1
      - name: Build and publish in COPR
        shell: bash
        run: |
          set -euo pipefail
          SRPM=$(find source-rpm -maxdepth 1 -name '*.src.rpm' -print -quit)
          copr-cli build maher-xs/uqda "${SRPM}"

  verify:
    name: Verify COPR install (${{ matrix.image }})
    needs: publish
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [fedora:43, fedora:44]
    container: ${{ matrix.image }}
    steps:
      - name: Enable COPR and install published packages
        run: |
          dnf -y install dnf5-plugins
          dnf -y copr enable maher-xs/uqda
          dnf -y install uqda uqda-gateway
      - name: Verify installed payload
        shell: bash
        run: |
          set -euo pipefail
          uqda -version | grep -F 'Build version: 0.1.4'
          uqdactl -version | grep -F 'Build version: 0.1.4'
          test -x /usr/bin/uqda-latency
          test -x /usr/bin/uqda-gateway
          systemd-analyze verify \
            /usr/lib/systemd/system/uqda.service \
            /usr/lib/systemd/system/uqda-default-config.service
          rpm -V uqda uqda-gateway
